<style>
:root{--bg:#e8ebed;--s:#fff;--ink:#14202b;--mu:#5a6773;--ln:#cfd5da;--ac:#1f5fd0;--ai:#fff;--ok:#1b7a43;--wn:#a65b00;--of:#6b7680;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12181e;--s:#1b232b;--ink:#eef2f5;--mu:#9aa7b2;--ln:#2c3742;--ac:#6aa1ff;--ai:#0b1520;--ok:#5fd08f;--wn:#f0b35a;--of:#8d99a4}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12181e;--s:#1b232b;--ink:#eef2f5;--mu:#9aa7b2;--ln:#2c3742;--ac:#6aa1ff;--ai:#0b1520;--ok:#5fd08f;--wn:#f0b35a;--of:#8d99a4}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.5}
.w{max-width:1440px;margin:0 auto;padding:0 20px}
h1{font-stretch:75%;font-weight:800;font-size:clamp(2.6rem,8vw,5.5rem);line-height:.95;letter-spacing:-.02em;margin:48px 0 14px;max-width:12ch}
.lead{margin:0 0 6px;max-width:56ch;color:var(--mu)}
.bar{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:10px;padding:16px 0 8px}
.bar input,.bar select{font:inherit;color:var(--ink);background:var(--s);border:1px solid var(--ln);border-radius:6px;padding:10px 12px;min-height:44px;width:100%}
@media(max-width:820px){.bar{grid-template-columns:1fr 1fr}.bar input{grid-column:1/-1}}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:8px 0 14px}
.chip{font:inherit;font-weight:600;font-size:.88rem;color:var(--ink);background:transparent;border:1px solid var(--ln);border-radius:999px;padding:7px 14px;min-height:40px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip span{color:var(--mu);font-weight:500;margin-left:4px}.chip[aria-pressed="true"] span{color:inherit;opacity:.7}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.count{color:var(--mu);font-size:.9rem;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px;padding-bottom:20px}
@media(max-width:1200px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:640px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.pr{font-size:1.25rem}.act{flex-direction:column}}
@media(max-width:380px){.grid{grid-template-columns:1fr}}
.card{background:var(--s);border:1px solid var(--ln);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.pic{aspect-ratio:16/8;display:grid;place-items:end center;position:relative;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 24%,var(--s)),color-mix(in srgb,var(--c) 8%,var(--s)))}
.pic svg{width:70%;margin-bottom:8px;color:var(--c);filter:drop-shadow(0 0 1px rgba(0,0,0,.35))}
.tag{position:absolute;top:10px;left:10px;font-size:.76rem;font-weight:700;padding:3px 9px;border-radius:4px;background:var(--s);border:1px solid currentColor}
.tag.ok{color:var(--ok)}.tag.wn{color:var(--wn)}.tag.of{color:var(--of)}
.bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.bd h2{margin:0;font-size:1.08rem;line-height:1.25}.sub{margin:0;color:var(--mu);font-size:.86rem}
.sp{margin:0;font-size:.84rem;color:var(--mu);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr{font-size:1.5rem;font-weight:800;font-stretch:90%;line-height:1.1;margin-top:auto}.pr small{display:block;font-size:.76rem;font-weight:500;color:var(--mu);font-stretch:100%}
.act{display:flex;gap:8px}
.btn{font:inherit;font-weight:700;text-decoration:none;text-align:center;border-radius:6px;padding:10px 12px;min-height:44px;cursor:pointer;flex:1;border:1px solid var(--ac);display:flex;align-items:center;justify-content:center;background:var(--ac);color:var(--ai)}
.btn.g{background:transparent;color:var(--ac)}
.more{display:block;margin:6px auto 48px;max-width:260px}
.empty{grid-column:1/-1;padding:40px 0;color:var(--mu)}
dialog{border:1px solid var(--ln);border-radius:12px;background:var(--s);color:var(--ink);padding:0;width:min(580px,calc(100% - 24px));max-height:90vh}
dialog::backdrop{background:rgba(0,0,0,.5)}
.dl{padding:18px 22px 22px;display:flex;flex-direction:column;gap:12px}.dl h2{margin:0;font-size:1.4rem;line-height:1.2}
.dl .x{align-self:flex-end;font:inherit;background:none;border:1px solid var(--ln);color:var(--ink);border-radius:6px;padding:6px 12px;cursor:pointer;min-height:40px}
dl{margin:0;display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;font-size:.9rem}dl div{display:flex;justify-content:space-between;border-bottom:1px solid var(--ln);padding-bottom:4px;gap:8px}dt{color:var(--mu)}dd{margin:0;font-weight:600;text-align:right}
.txt{margin:0;color:var(--mu);font-size:.92rem}
footer{border-top:1px solid var(--ln);padding:24px 0 40px;color:var(--mu);font-size:.88rem}footer p{margin:4px 0}footer a{color:var(--ac)}
